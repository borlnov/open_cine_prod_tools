name: "Build Windows Installer"
description: "Build an Inno Setup installer from a Flutter app build directory using a shared template"

inputs:
  version:
    description: "Version of the application to be packaged"
    required: true
  app-name:
    description: "Human-readable name of the application (e.g. 'Open Cine Prod Tools')"
    required: true
  executable-name:
    description: "Name of the main executable (without .exe extension, e.g. 'open_cine_prod_tools')"
    required: true
  app-build-directory:
    description: "Path to the Flutter app build directory relative to the repository root (e.g. 'build/windows/x64/runner')"
    required: true
  app-id:
    description: "Unique AppId GUID for the Inno Setup installer (e.g. 'B3A1E5F0-7C2D-4A8B-9F1E-6D3C5A2B4E7F')"
    required: true
  output-name:
    description: "Base name for the output installer file (version and _win64_setup suffix are appended, e.g. 'OpenCineProdTools')"
    required: true
  app-publisher:
    description: "Publisher name shown in the installer"
    required: false
    default: "Benoit Rolandeau"

outputs:
  installer-path:
    description: "Path to the generated installer exe"
    value: ${{ steps.build-installer.outputs.installer-path }}
  installer-file:
    description: "Filename of the generated installer exe"
    value: ${{ steps.build-installer.outputs.installer-file }}

runs:
  using: "composite"
  steps:
    - name: Generate and build Inno Setup installer
      id: build-installer
      shell: pwsh
      run: |
        $templatePath = "${{ github.action_path }}/../../inno-setup/installer.iss.template"
        $outputBaseFilename = "${{ inputs.output-name }}_${{ inputs.version }}_win64_setup"
        $issContent = Get-Content $templatePath -Raw

        # Substitute placeholders
        $issContent = $issContent -replace '{{APP_NAME}}', '${{ inputs.app-name }}'
        $issContent = $issContent -replace '{{APP_PUBLISHER}}', '${{ inputs.app-publisher }}'
        $issContent = $issContent -replace '{{APP_EXE_NAME}}', '${{ inputs.executable-name }}.exe'
        $issContent = $issContent -replace '{{APP_ID}}', '${{ inputs.app-id }}'
        $issContent = $issContent -replace '{{OUTPUT_BASE_FILENAME}}', $outputBaseFilename

        # Write the generated .iss into the build directory
        $issPath = "${{ inputs.app-build-directory }}/installer.iss"
        Set-Content -Path $issPath -Value $issContent

        # Build the installer
        Push-Location "${{ inputs.app-build-directory }}"
        iscc /DMyAppVersion="${{ inputs.version }}" installer.iss
        Pop-Location

        # Output the installer path
        $installerFile = "${outputBaseFilename}.exe"
        $installerPath = "${{ inputs.app-build-directory }}/${installerFile}"
        if (Test-Path $installerPath) {
          echo "installer-path=${installerPath}" >> $env:GITHUB_OUTPUT
          echo "installer-file=${installerFile}" >> $env:GITHUB_OUTPUT
          echo "Built installer: ${installerPath}"
        } else {
          echo "Error: Expected installer not found: ${installerPath}"
          exit 1
        }
