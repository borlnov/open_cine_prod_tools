name: Deploy User Guide

# The guide is rebuilt and published whenever its sources change on main. pull_request builds it too
# (without deploying) so a change is proven to compile before it is merged.
on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".github/workflows/deploy_docs.yml"
  pull_request:
    paths:
      - "docs-site/**"
      - ".github/workflows/deploy_docs.yml"
  workflow_dispatch:

# Least privilege by default; the deploy job elevates to what GitHub Pages needs.
permissions:
  contents: read

# One in-flight deployment at a time, and never cancel a running one: a half-published site is worse
# than a slightly delayed one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build the site
        run: npm run build

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs-site/build

  deploy:
    # Only main publishes; a pull request stops after the build above.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
