name: Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSES/**"
      - "REUSE.toml"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSES/**"
      - "REUSE.toml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ARTIFACT_RETENTION_DAYS: 10

jobs:
  get-version:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      env: ${{ steps.version.outputs.env }}

    steps:
      - name: Clone repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # git describe needs the full commit history, but no file trees
          fetch-depth: 0
          filter: tree:0

      - name: Calculate version
        id: version
        run: |
          # Extract version from git tag:
          # 'v0.1.0-1-g87a9b8d' ==> '0.1.0-1-g87a9b8d'
          # 'v0.1.0'            ==> '0.1.0'
          # '87a9b8d'           ==> '0.0.0-87a9b8d'
          VERSION=$(git describe --tags --always --match 'v[0-9]*' | \
            sed 's/^v//; /^[0-9]/! s/^/0.0.0-/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

          # Pick the build environment from the same stable-vs-not rule
          # verify-stable-schema-frozen uses: a stable build is a final semver
          # 'X.Y.Z' with no pre-release suffix (compiles in production); anything
          # else — a pre-release tag, a commit after a tag, an untagged commit —
          # carries a hyphenated suffix and compiles in qualification. These are
          # the parsedString values of act_config_manager's Environment enum,
          # read by the app through --dart-define="ENV=...".
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ENV=PROD
          else
            ENV=QUALIF
          fi
          echo "env=$ENV" >> "$GITHUB_OUTPUT"
          echo "Building environment $ENV"

  verify-stable-schema-frozen:
    name: Verify stable schema is frozen
    runs-on: ubuntu-latest
    # Runs on every tag push (like create-release), but only *asserts* on a stable tag — one whose
    # name carries no pre-release suffix. A stable release must have run the ADR 0029 freeze step,
    # bringing lastStableSchemaVersion up to currentSchemaVersion (and the payload-format pair with
    # it). A forgotten freeze fails here and blocks the release, rather than shipping a schema the
    # next stable build would no longer recognise. See docs/RELEASING.md.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Clone repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Assert the freeze on a stable tag
        run: |
          set -euo pipefail

          # A semver pre-release tag carries a hyphenated suffix ('v0.2.0-rc.1'), a final one never
          # does ('v0.2.0'): only the latter owes the freeze.
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "Pre-release tag ${GITHUB_REF_NAME}: no freeze owed, nothing to check."
            exit 0
          fi

          db="lib/models/database/ocpt_project_database.dart"
          codec="lib/managers/projects/services/ocpt_project_version_codec.dart"
          read_const() { grep -oP "static const $2 = \K[0-9]+" "$1"; }

          current_schema=$(read_const "$db" currentSchemaVersion)
          last_schema=$(read_const "$db" lastStableSchemaVersion)
          current_payload=$(read_const "$codec" currentPayloadFormat)
          last_payload=$(read_const "$codec" lastStablePayloadFormat)

          echo "schema:  current=$current_schema  last-stable=$last_schema"
          echo "payload: current=$current_payload  last-stable=$last_payload"

          status=0
          if [[ "$current_schema" != "$last_schema" ]]; then
            echo "::error::Stable tag ${GITHUB_REF_NAME} but lastStableSchemaVersion ($last_schema) != currentSchemaVersion ($current_schema): run the ADR 0029 freeze step (docs/RELEASING.md) before tagging."
            status=1
          fi
          if [[ "$current_payload" != "$last_payload" ]]; then
            echo "::error::Stable tag ${GITHUB_REF_NAME} but lastStablePayloadFormat ($last_payload) != currentPayloadFormat ($current_payload): run the ADR 0029 freeze step (docs/RELEASING.md) before tagging."
            status=1
          fi
          exit $status

  build-linux:
    name: Linux build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: get-version

    steps:
      - name: Clone repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev

      - name: Set up Flutter and dependencies
        uses: ./.github/actions/flutter-setup

      - name: Generate translations and database code
        run: |
          flutter pub get
          dart run intl_utils:generate
          dart run build_runner build

      # Linux embeds no launcher icon; only the Debian package's hicolor PNG, which the packaging
      # step reads straight from the swapped master, so the native icons need no regeneration here.
      - name: Apply qualification launcher icons
        uses: ./.github/actions/qualif-icons
        with:
          env: ${{ needs.get-version.outputs.env }}
          regenerate-native: "false"

      - name: Build for Linux
        uses: ./.github/actions/flutter-build
        with:
          target-platform: linux
          build-args: --dart-define=APP_VERSION=${{ needs.get-version.outputs.version }} --dart-define=ENV=${{ needs.get-version.outputs.env }}

      - name: Build Debian package
        id: deb
        uses: ./.github/actions/flutter-debian
        with:
          version: ${{ needs.get-version.outputs.version }}
          package-name: open-cine-prod-tools
          executable-name: open_cine_prod_tools
          app-build-directory: build/linux/x64/release/bundle
          app-name: Open Cine Prod Tools
          description-short: Open-source production tools for film making
          description-long: |-
            A Fountain screenplay editor, the first tool in an open-source suite
             covering the film pre-production and production pipeline.
          dependencies: "libgtk-3-0, libc6, libsecret-1-0"
          maintainer: "Benoit Rolandeau <borlnov.obsessio@gmail.com>"

      - name: Upload Debian package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenCineProdTools_${{ needs.get-version.outputs.version }}_amd64.deb
          path: artifacts/${{ steps.deb.outputs.deb-file }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  build-windows:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 60
    needs: get-version
    # Windows builds only run for release tags, main pushes, and manual
    # dispatches - not on every PR, to keep the common case cheap.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Clone repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Install Inno Setup (if missing)
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y
          } else {
            Write-Host "Inno Setup already installed: $((Get-Command iscc).Source)"
          }

      - name: Set up Flutter and dependencies
        uses: ./.github/actions/flutter-setup

      - name: Generate translations and database code
        shell: bash
        run: |
          flutter pub get
          dart run intl_utils:generate
          dart run build_runner build

      - name: Apply qualification launcher icons
        uses: ./.github/actions/qualif-icons
        with:
          env: ${{ needs.get-version.outputs.env }}

      - name: Build for Windows
        uses: ./.github/actions/flutter-build
        with:
          target-platform: windows
          build-args: --dart-define=APP_VERSION=${{ needs.get-version.outputs.version }} --dart-define=ENV=${{ needs.get-version.outputs.env }}

      - name: Build Windows installer
        id: installer
        uses: ./.github/actions/windows-installer
        with:
          version: ${{ needs.get-version.outputs.version }}
          app-name: Open Cine Prod Tools
          executable-name: open_cine_prod_tools
          app-build-directory: build/windows/x64/runner
          # Fixed AppId: must stay stable across releases so Windows
          # recognises upgrades instead of installing side by side.
          app-id: 69968E1A-654E-4AD3-B62A-0FEAEF2D7BB7
          output-name: OpenCineProdTools

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenCineProdTools_${{ needs.get-version.outputs.version }}_win64_setup
          path: ${{ steps.installer.outputs.installer-path }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  build-macos:
    name: macOS build
    runs-on: macos-latest
    timeout-minutes: 45
    needs: get-version
    # macOS builds follow the Windows gating: release tags, main pushes and manual
    # dispatches only, to keep the common case cheap.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    env:
      # The bundle's base name, PRODUCT_NAME in macos/Runner/Configs/AppInfo.xcconfig.
      MACOS_APP_NAME: Open Cine Prod Tools
      MACOS_BUILD_DIR: build/macos/Build/Products/Release
      # Signing and notarization stay dormant until these secrets exist. A secret cannot be
      # read from an 'if:', so they are mapped to environment variables here and the two steps
      # below key on those: with no certificate configured, the app keeps the ad-hoc signature
      # the Xcode project already asks for and the disk image ships unnotarized.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Clone repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up Flutter and dependencies
        uses: ./.github/actions/flutter-setup

      - name: Generate translations and database code
        run: |
          flutter pub get
          dart run intl_utils:generate
          dart run build_runner build

      - name: Apply qualification launcher icons
        uses: ./.github/actions/qualif-icons
        with:
          env: ${{ needs.get-version.outputs.env }}

      - name: Split the version for the bundle
        id: bundle-version
        run: |
          set -euo pipefail

          VERSION="${{ needs.get-version.outputs.version }}"

          # A bundle spells its version in two keys with narrow formats:
          # CFBundleShortVersionString only accepts dotted numbers, CFBundleVersion a build
          # counter. git describe gives neither on its own ('0.1.0-1-g87a9b8d'), so it is split:
          # the numeric prefix becomes --build-name, the commit distance - absent when the build
          # sits exactly on a tag - becomes --build-number. The full descriptive version is left
          # untouched for the disk image's file name.
          BUILD_NAME="${VERSION%%-*}"
          BUILD_NUMBER=$(printf '%s' "${VERSION}" | \
            sed -n 's/.*-\([0-9][0-9]*\)-g[0-9a-f][0-9a-f]*$/\1/p')

          echo "build-name=${BUILD_NAME}" >> "$GITHUB_OUTPUT"
          echo "build-number=${BUILD_NUMBER:-0}" >> "$GITHUB_OUTPUT"
          echo "Building bundle version ${BUILD_NAME} (${BUILD_NUMBER:-0})"

      - name: Build for macOS
        uses: ./.github/actions/flutter-build
        with:
          target-platform: macos
          build-args: >-
            --build-name=${{ steps.bundle-version.outputs.build-name }}
            --build-number=${{ steps.bundle-version.outputs.build-number }}
            --dart-define=APP_VERSION=${{ needs.get-version.outputs.version }}
            --dart-define=ENV=${{ needs.get-version.outputs.env }}

      - name: Sign the application bundle
        if: env.APPLE_CERTIFICATE != ''
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="${RUNNER_TEMP}/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          CERTIFICATE_PATH="${RUNNER_TEMP}/certificate.p12"

          # The certificate travels as base64 in the secret, and lands in a keychain of this
          # run's own so nothing is left behind on the runner.
          printf '%s' "${APPLE_CERTIFICATE}" | base64 --decode -o "${CERTIFICATE_PATH}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychain -d user -s "${KEYCHAIN_PATH}" login.keychain

          rm -f "${CERTIFICATE_PATH}"

          # The hardened runtime and the secure timestamp are what notarization requires, and
          # what an ad-hoc signature cannot carry - hence only on this path.
          codesign --deep --force --options runtime --timestamp \
            --sign "${APPLE_SIGNING_IDENTITY}" \
            "${MACOS_BUILD_DIR}/${MACOS_APP_NAME}.app"

      - name: Build macOS disk image
        id: dmg
        uses: ./.github/actions/macos-dmg
        with:
          version: ${{ needs.get-version.outputs.version }}
          app-name: ${{ env.MACOS_APP_NAME }}
          app-build-directory: ${{ env.MACOS_BUILD_DIR }}
          output-name: OpenCineProdTools

      - name: Notarize the disk image
        if: env.APPLE_CERTIFICATE != ''
        run: |
          set -euo pipefail

          xcrun notarytool submit "${{ steps.dmg.outputs.dmg-path }}" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait

          # Stapling the ticket onto the image is what lets a first launch succeed offline.
          xcrun stapler staple "${{ steps.dmg.outputs.dmg-path }}"

      - name: Check the application bundle and the disk image
        run: |
          set -euo pipefail

          APP_BUNDLE="${MACOS_BUILD_DIR}/${MACOS_APP_NAME}.app"
          DMG_PATH="${{ steps.dmg.outputs.dmg-path }}"

          echo "=== Architectures ==="
          lipo -archs "${APP_BUNDLE}/Contents/MacOS/${MACOS_APP_NAME}"

          echo ""
          echo "=== Signature ==="
          codesign -dv --verbose=2 "${APP_BUNDLE}"

          echo ""
          echo "=== Info.plist ==="
          plutil -lint "${APP_BUNDLE}/Contents/Info.plist"

          echo ""
          echo "=== Disk image contents ==="
          MOUNT_POINT=$(mktemp -d)
          hdiutil attach "${DMG_PATH}" -readonly -nobrowse -mountpoint "${MOUNT_POINT}"
          ls -l "${MOUNT_POINT}"

          # The volume must hold what the user is asked to drag, and what to drag it onto.
          # Detach either way, so a failure here never leaves the image mounted.
          STATUS=0
          test -d "${MOUNT_POINT}/${MACOS_APP_NAME}.app" || STATUS=1
          test -L "${MOUNT_POINT}/Applications" || STATUS=1

          hdiutil detach "${MOUNT_POINT}"

          if [ "${STATUS}" -ne 0 ]; then
              echo "Error: the disk image does not hold the expected drag-to-install layout"
          fi

          exit "${STATUS}"

      - name: Upload macOS disk image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenCineProdTools_${{ needs.get-version.outputs.version }}_macos_dmg
          path: ${{ steps.dmg.outputs.dmg-path }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  build-android:
    name: Android build
    runs-on: ubuntu-latest
    # Two Android builds now run here (the AAB then the APK); 40 minutes covers a cold cache.
    timeout-minutes: 40
    needs: get-version
    # Android builds follow the Windows/macOS gating: release tags, main pushes and manual
    # dispatches only, to keep the common case cheap.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Clone repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up the JDK
        # The Android Gradle build compiles against JDK 17, matching sourceCompatibility /
        # targetCompatibility / jvmTarget in android/app/build.gradle.kts.
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter and dependencies
        uses: ./.github/actions/flutter-setup

      - name: Generate translations and database code
        run: |
          flutter pub get
          dart run intl_utils:generate
          dart run build_runner build

      - name: Apply qualification launcher icons
        uses: ./.github/actions/qualif-icons
        with:
          env: ${{ needs.get-version.outputs.env }}

      - name: Build the Android app bundle
        # Release is debug-signed for now (android/app/build.gradle.kts's scaffold signingConfig);
        # a real upload key is a later, deliberate step. This job verifies the Android build in CI
        # and is deliberately kept out of create-release's assets until then.
        uses: ./.github/actions/flutter-build
        with:
          target-platform: appbundle
          build-args: --dart-define=APP_VERSION=${{ needs.get-version.outputs.version }} --dart-define=ENV=${{ needs.get-version.outputs.env }}

      - name: Name the Android app bundle after the app
        # Flutter always writes 'app-release.aab'; rename it so the extracted file, not just the
        # artifact, carries the app name and version.
        shell: bash
        run: mv build/app/outputs/bundle/release/app-release.aab
          "build/app/outputs/bundle/release/OpenCineProdTools_${{ needs.get-version.outputs.version }}.aab"

      - name: Upload the Android app bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenCineProdTools_${{ needs.get-version.outputs.version }}_android_aab
          path: build/app/outputs/bundle/release/OpenCineProdTools_${{ needs.get-version.outputs.version }}.aab
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Build the Android APK
        # The AAB above is the Play upload format and cannot be side-loaded; this APK is the
        # directly installable counterpart for on-device testing ('adb install <the .apk>').
        # Both are debug-signed for now (see the app bundle step) — the APK is a developer
        # convenience, not a distributable release, and is likewise kept out of create-release.
        uses: ./.github/actions/flutter-build
        with:
          target-platform: apk
          build-args: --dart-define=APP_VERSION=${{ needs.get-version.outputs.version }} --dart-define=ENV=${{ needs.get-version.outputs.env }}

      - name: Name the Android APK after the app
        # Flutter always writes 'app-release.apk'; rename it as above so the installable file
        # carries the app name and version.
        shell: bash
        run: mv build/app/outputs/flutter-apk/app-release.apk
          "build/app/outputs/flutter-apk/OpenCineProdTools_${{ needs.get-version.outputs.version }}.apk"

      - name: Upload the Android APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenCineProdTools_${{ needs.get-version.outputs.version }}_android_apk
          path: build/app/outputs/flutter-apk/OpenCineProdTools_${{ needs.get-version.outputs.version }}.apk
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  test-deb:
    name: Check .deb installation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ get-version, build-linux ]

    steps:
      - name: Download Debian package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: OpenCineProdTools_${{ needs.get-version.outputs.version }}_amd64.deb
          path: packages/

      - name: Install package
        run: |
          echo "Installing open-cine-prod-tools package..."
          sudo apt-get update -y
          # The package file is named after the Debian version, which is not the semver one for
          # pre-releases, so let the glob find the single package the artifact holds.
          sudo apt install -y ./packages/*.deb

          # Verify installation
          dpkg -l | grep open-cine-prod-tools
          which open-cine-prod-tools

      - name: Test package executable
        run: |
          echo "Testing open-cine-prod-tools executable exists and is executable..."
          test -x /usr/bin/open-cine-prod-tools
          test -x /usr/lib/open-cine-prod-tools/open_cine_prod_tools
          echo "Package executable check passed!"

      - name: Test package removal
        run: |
          echo "Testing package removal..."
          sudo apt-get remove -y open-cine-prod-tools
          echo "Package removed successfully!"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - get-version
      - verify-stable-schema-frozen
      - build-linux
      - build-windows
      - build-macos

    steps:
      - name: Download Debian package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: OpenCineProdTools_${{ needs.get-version.outputs.version }}_amd64.deb
          path: release-assets/

      - name: Download Windows installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: OpenCineProdTools_${{ needs.get-version.outputs.version }}_win64_setup
          path: release-assets/

      - name: Download macOS disk image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: OpenCineProdTools_${{ needs.get-version.outputs.version }}_macos_dmg
          path: release-assets/

      - name: Compute checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          generate_release_notes: true
          files: release-assets/**
          # A semver pre-release tag carries a hyphenated suffix ('0.1.0-alpha.1'), a
          # final one never does. Marking those releases keeps them off the repository's
          # "Latest release" slot, which must always point at a stable build.
          prerelease: ${{ contains(needs.get-version.outputs.version, '-') }}
