name: Dart Checks

# Paths cover everything the analyzer and the tests read: the app and package sources, the
# bundled dictionaries spell_kit's tests check themselves against, the dependency and lint
# configuration, the actlibs submodule pointer, and the CI definition itself.
# The two lists are identical and have to be repeated: GitHub Actions does not resolve YAML anchors.
on:
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "packages/**"
      - "assets/dictionaries/**"
      - "actlibs"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/flutter_lint.yml"
      - ".github/actions/flutter-setup/**"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "packages/**"
      - "assets/dictionaries/**"
      - "actlibs"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/flutter_lint.yml"
      - ".github/actions/flutter-setup/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.package.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package:
          - { name: app, path: . }
          - { name: fountain_kit, path: packages/fountain_kit }
          - { name: script_import_kit, path: packages/script_import_kit }
          - { name: spell_kit, path: packages/spell_kit }
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
      - name: Set up Flutter
        uses: ./.github/actions/flutter-setup
      - name: Get app dependencies
        if: matrix.package.path == '.'
        run: flutter pub get
      - name: Generate translations
        if: matrix.package.path == '.'
        run: dart run intl_utils:generate
      - name: Generate drift database code
        if: matrix.package.path == '.'
        run: dart run build_runner build
      - name: Get package dependencies
        if: matrix.package.path != '.'
        working-directory: ${{ matrix.package.path }}
        run: dart pub get
      - name: Analyze (app)
        if: matrix.package.path == '.'
        working-directory: ${{ matrix.package.path }}
        run: flutter analyze
      - name: Analyze (package)
        if: matrix.package.path != '.'
        working-directory: ${{ matrix.package.path }}
        run: dart analyze
      - name: Test (app)
        if: matrix.package.path == '.'
        working-directory: ${{ matrix.package.path }}
        run: flutter test
      - name: Test (package)
        if: matrix.package.path != '.'
        working-directory: ${{ matrix.package.path }}
        run: dart test
