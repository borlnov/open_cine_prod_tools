name: "Package Flutter App as Debian Package"
description: "Build a Debian package from a Flutter app build directory"

inputs:
  version:
    description: "Version of the application to be packaged"
    required: true
  package-name:
    description: "Name of the Debian package (e.g. 'open-cine-prod-tools')"
    required: true
  executable-name:
    description: "Name of the main executable inside the Flutter bundle (e.g. 'open_cine_prod_tools')"
    required: true
  app-build-directory:
    description: "Path to the Flutter app build directory relative to the repository root (e.g. 'build/linux/x64/release/bundle')"
    required: true
  app-name:
    description: "Human-readable name of the application (e.g. 'Open Cine Prod Tools')"
    required: true
  description-short:
    description: "Short description of the application for the Debian package"
    required: true
  description-long:
    description: "Long description of the application for the Debian package"
    required: true
  dependencies:
    description: "Runtime dependencies of the Debian package"
    required: false
    default: "libgtk-3-0"
  architecture:
    description: "Target architecture for the Debian package (e.g. 'amd64')"
    required: false
    default: "amd64"
  maintainer:
    description: "Maintainer of the Debian package"
    required: false
    default: "Benoit Rolandeau <borlnov.obsessio@gmail.com>"

outputs:
  deb-file:
    description: "Filename of the generated .deb package (under artifacts/)"
    value: ${{ steps.build-deb.outputs.deb-file }}

runs:
  using: "composite"
  steps:
    - name: Build Debian package
      id: build-deb
      shell: bash
      run: |
        set -euo pipefail

        PACKAGE_NAME="${{ inputs.package-name }}"
        VERSION="${{ inputs.version }}"
        ARCHITECTURE="${{ inputs.architecture }}"
        MAINTAINER="${{ inputs.maintainer }}"
        DESCRIPTION_SHORT="${{ inputs.description-short }}"
        DESCRIPTION_LONG="${{ inputs.description-long }}"
        DEPENDENCIES="${{ inputs.dependencies }}"
        EXECUTABLE_NAME="${{ inputs.executable-name }}"
        FLUTTER_BUILD_DIR="${{ inputs.app-build-directory }}"
        APP_NAME="${{ inputs.app-name }}"

        # Template directory relative to this action
        TEMPLATE_DIR="${GITHUB_ACTION_PATH}/../../debian-templates"

        echo "Building Debian package: ${PACKAGE_NAME} v${VERSION}"

        # Create directory structure
        DEB_DIR="debian-package/${PACKAGE_NAME}_${VERSION}_${ARCHITECTURE}"

        echo "Creating directory structure..."
        mkdir -p "${DEB_DIR}/usr/bin"
        mkdir -p "${DEB_DIR}/usr/lib/${PACKAGE_NAME}"
        mkdir -p "${DEB_DIR}/DEBIAN"

        # Copy Flutter application bundle
        echo "Copying Flutter application..."
        if [ ! -d "$FLUTTER_BUILD_DIR" ]; then
            echo "Error: Flutter build directory not found: $FLUTTER_BUILD_DIR"
            exit 1
        fi
        cp -r "${FLUTTER_BUILD_DIR}"/* "${DEB_DIR}/usr/lib/${PACKAGE_NAME}/"

        # Create launcher script from template
        echo "Creating launcher script..."
        sed -e "s/{{APP_NAME}}/${APP_NAME}/g" \
            -e "s/{{PACKAGE_NAME}}/${PACKAGE_NAME}/g" \
            -e "s/{{EXECUTABLE_NAME}}/${EXECUTABLE_NAME}/g" \
            "${TEMPLATE_DIR}/launcher.sh.template" > "${DEB_DIR}/usr/bin/${PACKAGE_NAME}"
        chmod +x "${DEB_DIR}/usr/bin/${PACKAGE_NAME}"

        # Create DEBIAN control file from template
        echo "Creating control file..."
        cp "${TEMPLATE_DIR}/control.template" "${DEB_DIR}/DEBIAN/control.tmp"
        sed -i "s/{{PACKAGE_NAME}}/${PACKAGE_NAME}/g" "${DEB_DIR}/DEBIAN/control.tmp"
        sed -i "s/{{VERSION}}/${VERSION}/g" "${DEB_DIR}/DEBIAN/control.tmp"
        sed -i "s/{{ARCHITECTURE}}/${ARCHITECTURE}/g" "${DEB_DIR}/DEBIAN/control.tmp"
        sed -i "s/{{DEPENDENCIES}}/${DEPENDENCIES}/g" "${DEB_DIR}/DEBIAN/control.tmp"
        sed -i "s/{{MAINTAINER}}/${MAINTAINER}/g" "${DEB_DIR}/DEBIAN/control.tmp"
        sed -i "s/{{DESCRIPTION_SHORT}}/${DESCRIPTION_SHORT}/g" "${DEB_DIR}/DEBIAN/control.tmp"
        # Handle DESCRIPTION_LONG with proper Debian control file formatting
        awk -v desc="${DESCRIPTION_LONG}" '
            BEGIN {
                gsub(/\n/, "\n ", desc)
                if (desc !~ /^ /) {
                    desc = " " desc
                }
            }
            {
                gsub(/{{DESCRIPTION_LONG}}/, desc)
                print
            }
        ' "${DEB_DIR}/DEBIAN/control.tmp" > "${DEB_DIR}/DEBIAN/control"
        rm "${DEB_DIR}/DEBIAN/control.tmp"

        # Copy postinst and postrm scripts
        echo "Copying maintainer scripts..."
        cp "${TEMPLATE_DIR}/postinst" "${DEB_DIR}/DEBIAN/postinst"
        chmod +x "${DEB_DIR}/DEBIAN/postinst"

        cp "${TEMPLATE_DIR}/postrm" "${DEB_DIR}/DEBIAN/postrm"
        chmod +x "${DEB_DIR}/DEBIAN/postrm"

        # Build the package
        echo "Building .deb package..."
        dpkg-deb --build --root-owner-group "${DEB_DIR}"

        # Move to artifacts directory
        mkdir -p artifacts
        DEB_FILE="${PACKAGE_NAME}_${VERSION}_${ARCHITECTURE}.deb"
        mv "${DEB_DIR}.deb" "artifacts/${DEB_FILE}"

        echo "deb-file=${DEB_FILE}" >> "$GITHUB_OUTPUT"

        # Show package information
        echo ""
        echo "Package built successfully: artifacts/${DEB_FILE}"
        echo ""
        echo "=== Package Info ==="
        dpkg-deb --info "artifacts/${DEB_FILE}"
        echo ""
        echo "=== Package Contents ==="
        dpkg-deb --contents "artifacts/${DEB_FILE}"
        echo ""
        echo "Done!"
