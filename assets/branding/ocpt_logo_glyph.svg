<!--
  The application mark stripped of its rounded square: the three perforations and the screenplay
  page alone, cropped to their own bounding box so they fill whatever box they are given.

  This variant is monochrome on purpose and is always tinted by its call site (it is drawn in white
  here only so it stays visible in an image viewer): it is meant to be laid over a surface that
  already carries the accent colour, such as the workspace toolbar's back badge, where the filled
  variant's violet square would be invisible.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="41" viewBox="0 0 48 41" fill="none">
  <rect y="2" width="9" height="9" rx="2" fill="#FFFFFF"/>
  <rect y="16" width="9" height="9" rx="2" fill="#FFFFFF"/>
  <rect y="30" width="9" height="9" rx="2" fill="#FFFFFF"/>
  <rect x="18" y="2" width="28" height="37" rx="4" stroke="#FFFFFF" stroke-width="4"/>
</svg>
