# Contains the parameters read by the act_logger_manager package.
#
# NOTE: ACT's Environment enum (act_config_manager) only recognizes the "local", "default",
# "development", "qualification" and "production" file names; there is no "staging" entry, so
# this file is never loaded by ConfigFromYamlUtility. It is kept and adapted to the same
# structure for consistency and in case a "qualification.yaml" alias is introduced later.
logs:
  level: info

  console:
    level: info
    printInRelease: true
