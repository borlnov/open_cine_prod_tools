# Contains the parameters read by the act_logger_manager package.
logs:
  # This defines the log level for the whole logger manager.
  level: debug

  # Contains the parameters for the console external logger.
  console:
    # This defines the minimum log level printed by the console logger.
    level: debug

  # Whether app logs are also written to a rotating file (crash-survivable). Read by the app, not
  # act_logger_manager itself.
  file:
    enabled: true
    level: debug
