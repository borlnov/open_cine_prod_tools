# Contains the parameters read by the act_logger_manager package.
logs:
  # This defines the log level for the whole logger manager. Possible values are:
  # all, trace, debug, info, warning, error, fatal and off.
  level: warning

  # Contains the parameters for the console external logger.
  console:
    # This defines the minimum log level printed by the console logger. Possible values are the
    # same as logs.level.
    level: warning

    # Indicates if the console logger keeps printing logs when the app runs in release mode.
    printInRelease: false

# Contains the parameters read by the act_licenses_manager package.
licenses:
  # The extra elements (app, ACT packages, fonts, ...) and their licenses, on top of the
  # dependencies Flutter's own license registry already knows about.
  extraElements:
    Open Cine Prod Tools:
      - Apache-2.0
      - CC0-1.0
    ACT packages:
      - LicenseRef-ALLCircuits-ACT-1.1
      - CC0-1.0
      - MIT
      - LicenseRef-DartProjectAuthors
    Courier Prime:
      - OFL-1.1

  # The assets folders to look for the license texts, declared as Flutter assets in pubspec.yaml.
  assetsFolders:
    - LICENSES
    - actlibs/LICENSES
