name: open_cine_prod_tools
description: "Open-source production tools for film making."
homepage: https://borlnov.github.io/open_cine_prod_tools/
repository: https://github.com/borlnov/open_cine_prod_tools
publish_to: none

version: 0.1.0

environment:
  sdk: ^3.11.1
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # Internationalize Flutter apps
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Help to implement value based equality without explicit override
  equatable: ^2.0.7

  # firstWhereOrNull and the other Iterable helpers the budget fiche resolves its own subject with
  collection: ^1.19.1

  # Implement the BLoC (Business Logic Component) design pattern
  flutter_bloc: ^9.1.1

  # Code to deal with internationalized/localized messages
  intl: ^0.20.2

  # Persistent, reactive, typed access to a per-project SQLite database
  drift: ^2.24.0

  # Ships the native sqlite3 library so drift can open databases on every desktop/mobile target
  sqlite3_flutter_libs: ^0.5.28

  # Used directly to narrowly catch SqliteException when a project file may be corrupted
  sqlite3: ^2.4.6

  # Builds and joins file system paths in a platform-independent way
  path: ^1.9.1

  # Resolves the per-platform application documents directory used as the default projects home
  path_provider: ^2.1.5

  # Generates the stable ids of screenplays, snapshots and scenes
  uuid: ^4.5.1

  # Computes the SHA-256 digest a shot's scenario coverage range is checked for staleness against
  crypto: ^3.0.6

  # Opens the GitHub repository link in the system browser
  url_launcher: ^6.3.2

  # Shows the native "save as" dialog for exports; promoted from a transitive dependency of
  # act_file_transfer_manager to a direct one now that the app calls it itself
  file_selector: ^1.1.0

  # Hands an export's bytes to the OS share sheet on mobile, where file_selector's getSaveLocation
  # and getDirectoryPath have no Android or iOS implementation
  share_plus: ^12.0.2

  # Scales fonts (.sp) and dimensions (.w/.h) on mobile only; neutralised to identity on desktop.
  flutter_screenutil: ^5.9.3

  # Speaks the sync relay's HTTP routes from OcptRelayRemoteStorage; promoted from a transitive
  # dependency now that the app calls it itself
  http: ^1.6.0

  # Speaks the sync relay's events WebSocket from OcptRelayRemoteStorage; promoted from a
  # transitive dependency now that the app calls it itself
  web_socket_channel: ^3.0.3

  # Draws the sharing invite's QR code; pure-Dart, no plugin. Replaces act_qr_code, whose
  # transitive qr_code_scanner does not build against this app's AGP 8 (namespace not specified).
  qr_flutter: ^4.1.0

  # Reads a QR code from the camera on the joining screen's mobile-only scan tab. Replaces
  # act_qr_code's QrCodeReader for the same reason as qr_flutter above; ships no Windows plugin,
  # which is fine since this widget is only ever built on mobile.
  mobile_scanner: ^7.1.2

  act_config_manager:
    path: actlibs/act_config_manager

  act_dart_result:
    path: actlibs/act_dart_result

  act_dart_utility:
    path: actlibs/act_dart_utility

  act_dart_value_keeper:
    path: actlibs/act_dart_value_keeper

  act_file_transfer_manager:
    path: actlibs/act_file_transfer_manager

  act_flutter_utility:
    path: actlibs/act_flutter_utility

  act_foundation:
    path: actlibs/act_foundation

  act_global_manager:
    path: actlibs/act_global_manager

  act_intl:
    path: actlibs/act_intl

  act_intl_ui:
    path: actlibs/act_intl_ui

  act_licenses_manager:
    path: actlibs/act_licenses_manager

  act_life_cycle:
    path: actlibs/act_life_cycle

  act_local_storage_manager:
    path: actlibs/act_local_storage_manager

  act_logger_manager:
    path: actlibs/act_logger_manager

  # Reads the running platform (isMobile/isDesktop) to gate the mobile-only responsive scaling.
  act_platform_manager:
    path: actlibs/act_platform_manager

  act_router_manager:
    path: actlibs/act_router_manager

  act_themes_manager:
    path: actlibs/act_themes_manager

  fountain_kit:
    path: packages/fountain_kit

  ocpt_sync_protocol:
    path: packages/ocpt_sync_protocol

  script_import_kit:
    path: packages/script_import_kit

  spell_kit:
    path: packages/spell_kit

  # Document editing toolkit backing the editor's styled block editing mode. Pinned to an exact
  # version (no caret): its API is still pre-1.0 and moves between dev releases. dev.52 is the
  # first pin that compiles against this repo's Flutter SDK: since 3.44, `TextInputConnection`
  # declares an abstract `updateStyle(TextInputStyle)` that super_editor's `DocumentImeInputClient`
  # only overrides from dev.51 onwards, so the earlier dev.50 no longer builds.
  super_editor: 0.3.0-dev.52

  # Builds the exported screenplay PDF (embedded Courier Prime, paginated body, title page)
  pdf: ^3.12.0

  # Writes the exported shot list workbook (XLSX). The community fork of `excel` rather than
  # `excel` itself, whose latest release is still capped at `archive ^3` and `xml <7` and can
  # therefore not be resolved alongside the `image` version `icons_launcher` pulls in; see
  # docs/adr/0008-excel-community-for-the-shot-list-export.md
  excel_community: ^2.2.0

  # Reads and writes the portable project package: the `.ocpt` plus every file it references, as
  # one zip somebody can send. Streamed to and from disk rather than held in memory — a project
  # carrying two hundred scouting photos is an ordinary case. Already an indirect dependency
  # through `excel_community`, named here because the app now uses it in its own right.
  archive: ^4.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Used to generate the translation files
  intl_utils: ^2.8.10

  # Provides InMemorySharedPreferencesAsync, used to back OcptPropertiesManager in tests
  shared_preferences_platform_interface: ^2.4.2

  # Provides tester.ime.backspace, used to simulate the IME delta channel's own Backspace path
  # (super_editor's own supereditor_robot.dart only wraps its typeText, not its backspace)
  flutter_test_robots: ^0.0.24

  # Provides withClock, used to freeze the wall clock super_editor's undo-grouping policy reads
  # (`MergeRapidTextInputPolicy` compares transaction timestamps taken with `clock.now()`), so a
  # typing-run test measures the grouping rule rather than the test VM's own real-time gaps
  clock: ^1.1.2

  # Generates the drift/*.g.dart companion code (tables, DAOs) from the annotated database classes
  drift_dev: ^2.24.0

  # Brings in the icons_launcher tooling used to turn the branding masters into every platform's
  # launcher icon (`dart run icons_launcher:create`, configured by the icons_launcher block below)
  act_launcher_icon:
    path: actlibs/act_launcher_icon

  # Runs the code generators (drift_dev, intl_utils) declared as build_runner builders
  build_runner: ^2.4.13

  # Provides StreamChannelMixin, used to build a fake WebSocketChannel for
  # OcptRelayRemoteStorage's tests; promoted from a transitive dependency now that a test imports
  # it directly
  stream_channel: ^2.1.4


flutter:
  uses-material-design: true

  assets:
    - assets/config/
    # The three variants of the application mark are listed one by one rather than as a whole
    # directory: `assets/branding/icons/` sits next to them and holds the PNG masters the launcher
    # icon generator and the Debian packaging consume, which have no business being bundled into
    # the application.
    - assets/branding/ocpt_logo_light.svg
    - assets/branding/ocpt_logo_dark.svg
    - assets/branding/ocpt_logo_glyph.svg
    - assets/fonts/courier_prime/
    - assets/fonts/roboto/
    # One directory per language: each holds the verbatim upstream `.dic`/`.aff` pair the
    # spell checker parses, plus the licence notice both upstream projects require to travel
    # next to the files it covers.
    - assets/dictionaries/fr/
    - assets/dictionaries/en_GB/
    - LICENSES/
    - actlibs/LICENSES/

  fonts:
    - family: CourierPrime
      fonts:
        - asset: assets/fonts/courier_prime/CourierPrime-Regular.ttf
        - asset: assets/fonts/courier_prime/CourierPrime-Bold.ttf
          weight: 700
        - asset: assets/fonts/courier_prime/CourierPrime-Italic.ttf
          style: italic
        - asset: assets/fonts/courier_prime/CourierPrime-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/roboto/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/roboto/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/roboto/Roboto-BoldItalic.ttf
          weight: 700
          style: italic

# Turns the branding masters of assets/branding/icons/ into every platform's launcher icon, through
# `dart run icons_launcher:create`. The generated icons are committed, so this only has to be run
# again when the mark itself changes.
#
# Linux is deliberately left out: the platform support of icons_launcher writes a snapcraft icon,
# while this app ships a Debian package, whose icon and desktop entry are built from the same
# masters by .github/actions/flutter-debian instead.
icons_launcher:
  image_path: "assets/branding/icons/ocpt_icon_1024.png"
  platforms:
    android:
      enable: true
      adaptive_background_color: "#6C5CE7"
      adaptive_foreground_image: "assets/branding/icons/ocpt_icon_adaptive_foreground_1024.png"
    ios:
      enable: true
      # iOS masks the icon itself and rejects any transparency, so it gets the opaque, full-bleed
      # master rather than the rounded one every other platform uses.
      image_path: "assets/branding/icons/ocpt_icon_ios_1024.png"
    macos:
      enable: true
    windows:
      enable: true

flutter_intl:
  enabled: true
  # Sets the name for the generated localization class. Default: S
  class_name: Tr
  # Sets the main locale used for generating localization files.
  main_locale: en_GB
