name: open_cine_prod_tools
description: "Open-source production tools for film making."
publish_to: none

version: 0.1.0

environment:
  sdk: ^3.11.1
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  act_config_manager:
    path: actlibs/act_config_manager

  act_dart_result:
    path: actlibs/act_dart_result

  act_dart_utility:
    path: actlibs/act_dart_utility

  act_flutter_utility:
    path: actlibs/act_flutter_utility

  act_foundation:
    path: actlibs/act_foundation

  act_global_manager:
    path: actlibs/act_global_manager

  act_life_cycle:
    path: actlibs/act_life_cycle

  act_logger_manager:
    path: actlibs/act_logger_manager

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/config/
