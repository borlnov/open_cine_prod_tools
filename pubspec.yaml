name: open_cine_prod_tools
description: "Open-source production tools for film making."
publish_to: none

version: 0.1.0

environment:
  sdk: ^3.11.1
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # Internationalize Flutter apps
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Help to implement value based equality without explicit override
  equatable: ^2.0.7

  # Implement the BLoC (Business Logic Component) design pattern
  flutter_bloc: ^9.1.1

  # Code to deal with internationalized/localized messages
  intl: ^0.20.2

  act_config_manager:
    path: actlibs/act_config_manager

  act_dart_result:
    path: actlibs/act_dart_result

  act_dart_utility:
    path: actlibs/act_dart_utility

  act_flutter_utility:
    path: actlibs/act_flutter_utility

  act_foundation:
    path: actlibs/act_foundation

  act_global_manager:
    path: actlibs/act_global_manager

  act_intl:
    path: actlibs/act_intl

  act_intl_ui:
    path: actlibs/act_intl_ui

  act_life_cycle:
    path: actlibs/act_life_cycle

  act_local_storage_manager:
    path: actlibs/act_local_storage_manager

  act_logger_manager:
    path: actlibs/act_logger_manager

  act_router_manager:
    path: actlibs/act_router_manager

  act_themes_manager:
    path: actlibs/act_themes_manager

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Used to generate the translation files
  intl_utils: ^2.8.10

  # Provides InMemorySharedPreferencesAsync, used to back OcptPropertiesManager in tests
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true

  assets:
    - assets/config/

flutter_intl:
  enabled: true
  # Sets the name for the generated localization class. Default: S
  class_name: Tr
  # Sets the main locale used for generating localization files.
  main_locale: en_GB
