version = 1

[[annotations]]
path = ["macos/**", "windows/**", "android/**", "ios/**", "linux/**", ".metadata"]
SPDX-FileCopyrightText = "2026 Benoit Rolandeau <borlnov.obsessio@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
# .gitmodules is a plain git config file: it has no comment syntax reuse recognizes, so its
# licensing information is declared here instead of inline.
path = [".gitmodules"]
SPDX-FileCopyrightText = "2026 Benoit Rolandeau <borlnov.obsessio@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
# ARB files are plain JSON: they have no comment syntax reuse recognizes, so their licensing
# information is declared here instead of inline.
path = ["lib/l10n/*.arb"]
SPDX-FileCopyrightText = "2026 Benoit Rolandeau <borlnov.obsessio@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
# lib/generated/ is produced by `dart run intl_utils:generate` and is git-ignored (see
# lib/generated/.gitignore); it's annotated here so that a local build of this directory doesn't
# fail the reuse check before the ignore rule is picked up.
path = ["lib/generated/**"]
SPDX-FileCopyrightText = "2026 Benoit Rolandeau <borlnov.obsessio@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
# *.g.dart files are produced by `dart run build_runner build` (drift's DriftDatabase codegen) and
# are git-ignored (see .gitignore); annotated here so a local build of these files doesn't fail the
# reuse check before the ignore rule is picked up.
path = ["**/*.g.dart"]
SPDX-FileCopyrightText = "2026 Benoit Rolandeau <borlnov.obsessio@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
# The PNG masters of the application mark are rasterized from the SVGs' geometry by
# tool/generate_branding_icons.dart. Binary images have no comment syntax reuse recognizes, so
# their licensing information is declared here instead of inline.
path = ["assets/branding/icons/**"]
SPDX-FileCopyrightText = "2026 Benoit Rolandeau <borlnov.obsessio@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
# The README screenshots are captures of this application running, taken against a demonstration
# screenplay written for the purpose. Binary images have no comment syntax reuse recognizes, so
# their licensing information is declared here instead of inline.
path = ["docs/screenshots/**"]
SPDX-FileCopyrightText = "2026 Benoit Rolandeau <borlnov.obsessio@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
# The Courier Prime TTFs are fetched verbatim from Google Fonts (itself mirroring
# https://github.com/quoteunquoteapps/CourierPrime), used to typeset the screenplay editor's
# preview in the traditional screenplay font. Binary font files have no comment syntax reuse
# recognizes, so their licensing information is declared here instead of inline.
path = ["assets/fonts/courier_prime/**"]
SPDX-FileCopyrightText = "2015 The Courier Prime Project Authors (https://github.com/quoteunquoteapps/CourierPrime)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
# The Roboto TTFs are static per-weight instances fetched verbatim from Google Fonts (itself
# mirroring https://github.com/googlefonts/roboto-classic), used as the studio design system's UI
# typeface so it renders identically on Linux and Windows regardless of which system fonts are
# installed. Binary font files have no comment syntax reuse recognizes, so their licensing
# information is declared here instead of inline.
path = ["assets/fonts/roboto/**"]
SPDX-FileCopyrightText = "2011 The Roboto Project Authors (https://github.com/googlefonts/roboto-classic)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
# The French hunspell dictionary is taken verbatim from https://github.com/wooorm/dictionaries,
# which republishes the “Dictionnaires orthographiques français” 7.5 unmodified. Keeping the pair
# byte for byte is what makes this licensing statement true and what lets a later version bump be a
# file swap; `.dic` files have no comment syntax reuse recognizes, so the licensing information of
# the whole language directory is declared here instead of inline.
path = ["assets/dictionaries/fr/**"]
SPDX-FileCopyrightText = "2020 Olivier R. and the Dictionnaires orthographiques français contributors (https://grammalecte.net/)"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
# The British English hunspell dictionary is taken verbatim from
# https://github.com/wooorm/dictionaries, which republishes the `en_GB-ise` dictionary derived from
# SCOWL 2020.12.07 unmodified. Its notice is a bespoke permissive grant carrying the Ispell BSD
# licence and several public-domain notices inside it, and no SPDX identifier names that
# collection, hence the `LicenseRef-`. `.dic` files have no comment syntax reuse recognizes, so the
# licensing information of the whole language directory is declared here instead of inline.
path = ["assets/dictionaries/en_GB/**"]
SPDX-FileCopyrightText = "2000-2018 Kevin Atkinson <kevina@gnu.org> and the SCOWL contributors"
SPDX-License-Identifier = "LicenseRef-SCOWL"
