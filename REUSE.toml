version = 1

[[annotations]]
path = ["macos/**", "windows/**", "android/**", "ios/**", "linux/**", ".metadata"]
SPDX-FileCopyrightText = "2026 Benoit Rolandeau <borlnov.obsessio@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
# .gitmodules is a plain git config file: it has no comment syntax reuse recognizes, so its
# licensing information is declared here instead of inline.
path = [".gitmodules"]
SPDX-FileCopyrightText = "2026 Benoit Rolandeau <borlnov.obsessio@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
# ARB files are plain JSON: they have no comment syntax reuse recognizes, so their licensing
# information is declared here instead of inline.
path = ["lib/l10n/*.arb"]
SPDX-FileCopyrightText = "2026 Benoit Rolandeau <borlnov.obsessio@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
# lib/generated/ is produced by `dart run intl_utils:generate` and is git-ignored (see
# lib/generated/.gitignore); it's annotated here so that a local build of this directory doesn't
# fail the reuse check before the ignore rule is picked up.
path = ["lib/generated/**"]
SPDX-FileCopyrightText = "2026 Benoit Rolandeau <borlnov.obsessio@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
# *.g.dart files are produced by `dart run build_runner build` (drift's DriftDatabase codegen) and
# are git-ignored (see .gitignore); annotated here so a local build of these files doesn't fail the
# reuse check before the ignore rule is picked up.
path = ["**/*.g.dart"]
SPDX-FileCopyrightText = "2026 Benoit Rolandeau <borlnov.obsessio@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
# The Courier Prime TTFs are fetched verbatim from Google Fonts (itself mirroring
# https://github.com/quoteunquoteapps/CourierPrime), used to typeset the screenplay editor's
# preview in the traditional screenplay font. Binary font files have no comment syntax reuse
# recognizes, so their licensing information is declared here instead of inline.
path = ["assets/fonts/courier_prime/**"]
SPDX-FileCopyrightText = "2015 The Courier Prime Project Authors (https://github.com/quoteunquoteapps/CourierPrime)"
SPDX-License-Identifier = "OFL-1.1"
