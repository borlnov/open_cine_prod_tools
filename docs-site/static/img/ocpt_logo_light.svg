  <rect x="15" y="20" width="9" height="9" rx="2" fill="#FFFFFF"/>
  <rect x="15" y="34" width="9" height="9" rx="2" fill="#FFFFFF"/>
  <rect x="15" y="48" width="9" height="9" rx="2" fill="#FFFFFF"/>
  <rect x="33" y="20" width="28" height="37" rx="4" stroke="#FFFFFF" stroke-width="4"/>
</svg>
