# Dev container service for Open Cine Prod Tools.
#
# Two mount modes, selected entirely by an OPTIONAL .devcontainer/.env file:
#
#   * Simple (default, no .env): the repository clone is mounted at
#     /workspaces/open_cine_prod_tools and nothing else from the host is exposed. Use this if you
#     don't need git worktrees.
#
#   * Worktree (opt-in via .env): the PROJECT ROOT one level above the clone is mounted at
#     /workspaces, so the clone (/workspaces/open_cine_prod_tools) and its sibling worktrees
#     (/workspaces/<branch>) are all visible inside the container. This lets several agents
#     work on different branches in parallel. See .env.example and README.md.
#
# In BOTH modes the clone ends up at /workspaces/open_cine_prod_tools, which is why devcontainer.json
# can keep a single static workspaceFolder regardless of which mode is active.
#
# This file replaces the former devcontainer.json `runArgs`, `workspaceMount` and `build`, none
# of which are honoured once a container is Docker Compose based.

services:
  dev:
    build:
      # Context is .devcontainer (this file's directory).
      context: .
      dockerfile: Dockerfile
      args:
        USERNAME: debian
    # Was runArgs: --network=host
    network_mode: host
    # Forward the gh token into the container as a real env var. The value comes from the
    # auto-loaded .devcontainer/.env (Compose substitutes it here; see .env.example). Optional: if
    # unset it resolves to empty and gh just falls back to `gh auth login`. Claude needs nothing
    # here — it's an in-container `claude` sign-in.
    environment:
      GH_TOKEN: ${GH_TOKEN:-}
    volumes:
      # Workspace mount. Defaults to simple mode: clone -> /workspaces/open_cine_prod_tools.
      # Worktree users set both vars in .devcontainer/.env (see .env.example):
      #   WORKSPACE_MOUNT_SOURCE=../..   # the project root, one level above the clone
      #   WORKSPACE_MOUNT_TARGET=/workspaces
      # Relative sources resolve against this file's directory (.devcontainer): `..` is the clone,
      # `../..` is the project root that also contains the sibling worktrees.
      #
      # The simple-mode default target below MUST equal workspaceFolder in devcontainer.json (a mount
      # target inherently has to). That file is the single source of truth; this is the one value
      # that has to be kept in sync with it by hand.
      - ${WORKSPACE_MOUNT_SOURCE:-..}:${WORKSPACE_MOUNT_TARGET:-/workspaces/open_cine_prod_tools}:cached
      # Was runArgs: --volume=/tmp/.X11-unix:/tmp/.X11-unix:z. Forwards the X11 socket so the Flutter
      # Linux desktop app can open a window from inside the container.
      - /tmp/.X11-unix:/tmp/.X11-unix:z
      # Claude Code config (login, sessions, transcripts, todos, plans, plugin index; CLAUDE_CONFIG_DIR
      # points here) in an ISOLATED named volume, NOT a host bind mount: Claude's plugin index stores
      # absolute in-container paths that a shared host ~/.claude would leak across containers/users. The
      # Dockerfile pre-creates ~/.claude so this volume initialises with user ownership. See README.md.
      - ocpt-claude-config:/home/debian/.claude
      # Pub package cache in a named volume: without it every fresh `docker compose run` container
      # starts with an empty ~/.pub-cache and re-downloads all dependencies. The Dockerfile
      # pre-creates the directory so the volume initialises with user ownership.
      - ocpt-pub-cache:/home/debian/.pub-cache
    # The image's CMD is just bash; keep the service alive so VS Code can attach into it.
    command: sleep infinity

volumes:
  # Isolated per-container Claude Code config. Persists across rebuilds, shared with nothing.
  ocpt-claude-config:
  # Pub package cache shared by successive containers of this project (see the mount above).
  ocpt-pub-cache:
